<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="140" height="96" role="img" aria-labelledby="title desc">
  <title id="title">Ultimate Krypton Inc.</title>
  <desc id="desc">Cyber gold octagonal shield with code brackets and an interlocking UK circuit monogram.</desc>
  <defs>
    <linearGradient id="cyberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/><stop offset="35%" stop-color="#FFD700"/><stop offset="70%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#8A640F"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#5B4105"/>
    </linearGradient>
    <radialGradient id="nodeGlow"><stop offset="0%" stop-color="#FFF8DC"/><stop offset="40%" stop-color="#FFD700" stop-opacity=".8"/><stop offset="100%" stop-color="#FFD700" stop-opacity="0"/></radialGradient>
    <radialGradient id="techBg" cx="50%" cy="45%" r="65%"><stop offset="0%" stop-color="#121620"/><stop offset="60%" stop-color="#0A0C12"/><stop offset="100%" stop-color="#040508"/></radialGradient>
    <filter id="cyberGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="800" height="550" rx="20" fill="url(#techBg)"/>
  <g stroke="#FFD700" stroke-width="1" opacity=".04"><path d="M0 100h800M0 200h800M0 300h800M0 400h800"/><path d="M150 0v550M300 0v550M450 0v550M600 0v550M750 0v550"/><path d="M0 0l200 200M800 0L600 200M0 550l200-200M800 550L600 350"/></g>
  <g transform="translate(400 190)">
    <polygon points="0,-125 90,-90 125,0 90,90 0,125 -90,90 -125,0 -90,-90" fill="none" stroke="url(#cyberGold)" stroke-width="6"/>
    <polygon points="0,-110 78,-78 110,0 78,78 0,110 -78,78 -110,0 -78,-78" fill="#0A0C12" stroke="url(#goldEdge)" stroke-width="2"/>
    <path d="M-75-40L-100 0l25 40M75-40l25 40-25 40" fill="none" stroke="url(#cyberGold)" stroke-width="5"/>
    <path d="M-45-55v85a25 25 0 0 0 25 25h40a25 25 0 0 0 25-25v-85M-15-55v100M-15-5l45-45h20M-15 5l45 45h20" fill="none" stroke="url(#cyberGold)" stroke-width="8" stroke-linecap="round"/>
    <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#cyberGold)" filter="url(#cyberGlow)"/><circle r="4" fill="#0A0C12"/>
    <circle cx="-45" cy="-55" r="5" fill="url(#cyberGold)"/><circle cx="45" cy="-55" r="5" fill="url(#cyberGold)"/><circle cx="50" cy="-50" r="4" fill="url(#cyberGold)"/><circle cx="50" cy="50" r="4" fill="url(#cyberGold)"/>
    <circle cy="-125" r="8" fill="url(#nodeGlow)" filter="url(#cyberGlow)"/><circle cx="125" r="8" fill="url(#nodeGlow)" filter="url(#cyberGlow)"/><circle cy="125" r="8" fill="url(#nodeGlow)" filter="url(#cyberGlow)"/><circle cx="-125" r="8" fill="url(#nodeGlow)" filter="url(#cyberGlow)"/>
  </g>
  <g transform="translate(400 395)" text-anchor="middle">
    <text y="-15" fill="#FFD700" font-family="monospace" font-size="11" font-weight="600" letter-spacing="6" opacity=".6">// SYSTEM_ID: UK-36</text>
    <text y="20" fill="url(#cyberGold)" font-family="system-ui,sans-serif" font-size="32" font-weight="900" letter-spacing="10">ULTIMATE KRYPTON</text>
    <text y="50" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="700" letter-spacing="12" opacity=".85">INC.</text>
    <path d="M-220 68h180M40 68h180" stroke="url(#cyberGold)" stroke-width="1.5" opacity=".4"/><circle cy="68" r="3" fill="url(#cyberGold)"/>
  </g>
