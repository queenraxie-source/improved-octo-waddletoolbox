<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Pro Finder local demo</title>
  <style>
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font: 16px sans-serif; }
    video { display: block; width: min(100%, 640px); margin: 1rem 0; background: #111; }
  </style>
</head>
<body>
  <p><strong>Ultimate Krypton Inc.</strong></p>
  <h1>Video Pro Finder demo</h1>
  <p>This page exercises direct video, source, anchor, subtitle, and playlist detection.</p>
  <video controls poster="https://interactive-examples.mdn.mozilla.net/media/cc0-images/flower.jpg">
    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    <track kind="subtitles" srclang="en" label="English" src="sample.vtt">
  </video>
  <video controls src="https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4"></video>
  <p><a href="https://example.test/video/master.m3u8">Sample HLS master playlist link</a></p>
  <script>
    // URL-shaped test data; the extension treats script content as untrusted text.
    window.demoVideoApi = { source: "https://example.test/video/master.m3u8" };
  </script>
</body>
</html>
