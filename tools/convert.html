<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convert media | Video Pro Finder</title><link rel="stylesheet" href="shared.css"></head>
<body><main class="shell"><header class="topbar"><div class="brand"><img src="../icons/ultimate-krypton.svg" alt="Ultimate Krypton Inc."><span>Convert media</span></div><a class="button" href="index.html">Toolbox</a></header><section class="panel"><p class="eyebrow">LOCAL ONLY</p><h1>Remux or convert a media file</h1><p class="muted">Drop a file here or choose your last successful download. Files never leave this browser.</p><label class="dropzone" id="dropzone" for="file-input"><span><strong>Drop .ts, .mp4, .mkv, or .webm here</strong><br><small class="muted">or choose a local file</small></span></label><input id="file-input" type="file" accept=".ts,.mp4,.mkv,.webm,.mov,video/*" hidden><div class="row" style="margin-top:14px"><span class="file-name" id="file-name">No file selected</span><button class="button" id="history-file">Use last successful download</button></div><div class="outputs" aria-label="Output format"><button class="output active" data-format="mp4">MP4<br><small>default</small></button><button class="output" data-format="mkv">MKV</button><button class="output" data-format="mov">MOV</button><button class="output" data-format="webm">WebM</button></div><div class="row"><span class="muted" id="mode">Path A: remux, no re-encode</span><button class="button primary" id="convert" disabled>Convert locally</button></div><progress id="progress" value="0" max="100" hidden></progress><div class="status" id="status" role="status">Select a file to begin.</div></section></main><script type="module" src="convert.js"></script></body></html>
